summary: 'AHM has no persisted customer-visible objects with ids: every paid operation takes a wallet `address` (0x + 40 hex)
  and returns a report envelope (`*Response` wrapping a `*Report`). The one stateful object is the alert Subscription (created
  by /alerts/subscribe, shaped by ConfigureRequest/AlertThresholds, readable at /alerts/status), plus the caller''s RoutingPolicy
  (RoutingPolicyRequest/Response, keyed on the caller). The AHS family is the richest graph: AHSResponse -> AHSReport -> AHSDimensionScore[],
  AHSCrossDimensionalPattern[], AHSShadowSignals, Recommendation[]; batch wraps it as AHSBatchResponse -> AHSBatchResultItem[].
  Nansen enrichment appears as NansenLabel, Counterparty, RelatedWallet, PnlSummary/PnlTokenSummary, OperationalHealth on
  the premium/counterparty/network-map responses. Errors: HTTPValidationError -> ValidationError[].'
