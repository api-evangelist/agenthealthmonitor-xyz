agent_card:
  name: Agent Health Monitor (AHM)
  description: A trust-scoring and health-monitoring service for AI agents. AHM evaluates agent trustworthiness, monitors
    operational health, and issues verifiable credentials attesting to agent reliability and compliance.
  url: https://agenthealthmonitor.xyz/a2a
  version: 0.1.0
  provider:
    organization: Digital Intensity Ltd
    url: https://agenthealthmonitor.xyz
  documentation_url: https://agenthealthmonitor.xyz/endpoints
  icon_url: https://agenthealthmonitor.xyz/static/ahm-logo.png
  capabilities:
    streaming: false
    pushNotifications: true
    stateTransitionHistory: true
    extendedAgentCard: true
  default_input_modes:
  - application/json
  - text/plain
  default_output_modes:
  - application/json
  supported_interfaces:
  - url: https://agenthealthmonitor.xyz/a2a
    protocolBinding: JSONRPC
    protocolVersion: '1.0'
  - url: https://agenthealthmonitor.xyz/a2a/http
    protocolBinding: HTTP+JSON
    protocolVersion: '1.0'
  security_schemes:
  - bearerAuth
  - apiKey
  skills:
  - id: trust_score_evaluation
    name: Trust Score Evaluation
    tags:
    - trust
    - scoring
    - evaluation
    - risk-assessment
  - id: agent_health_monitoring
    name: Agent Health Monitoring
    tags:
    - health
    - monitoring
    - uptime
    - observability
  - id: verifiable_credential_issuance
    name: Verifiable Credential Issuance
    tags:
    - credentials
    - verifiable
    - attestation
    - compliance
    - W3C-VC
  - id: trust_report_generation
    name: Trust Report Generation
    tags:
    - report
    - analytics
    - trust-history
    - benchmarking
  - id: agent_registration
    name: Agent Registration
    tags:
    - registration
    - onboarding
    - discovery
  skill_count: 5
  extensions:
  - urn:ahm:extension:verifiable-credentials:1.0
  - urn:ahm:extension:trust-dimensions:1.0
x-notes:
  card_vs_deployed_product: The card describes a trust-scoring service that "issues verifiable credentials" and offers "trust
    report generation"; the deployed REST API (openapi/agenthealthmonitor-xyz-openapi.yml, info.version 1.8.0) is wallet-intelligence
    for agents on Base L2 — risk scores, health reports, the Agent Health Score, trust routing, alerts. The skills map loosely
    onto real operations (trust_score_evaluation ~ get_ahs_report_ahs__address__get / get_risk_score_risk__address__get; agent_health_monitoring
    ~ subscribe_alerts_alerts_subscribe__address__get + alert_status_alerts_status__address__get; trust_report_generation
    ~ get_report_card_report_card__address__get; agent_registration ~ no public operation — the trust registry is populated
    by nightly scans of ERC-8004/ACP/Olas/Celo/Arc). verifiable_credential_issuance has no public operation; the provider's
    ECOSYSTEM.md shows a sample W3C VC and describes issuance via the agntcy Identity Service as planned work.
  a2a_endpoint: No A2A JSON-RPC server is deployed at the declared url. The pipeline sent one discovery-shaped JSON-RPC message
    (agent/getAuthenticatedExtendedCard) and received the FastAPI 404 envelope; no task was created and no paid operation
    was invoked.
