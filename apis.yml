- aid: agenthealthmonitor-xyz:ahm-verify-api
  name: AHM Verify API
  description: 'Post-transaction output-quality scoring: register a job specification (POST /v1/specs, free), submit an agent''s
    delivered output for evaluation by a six-role adversarial Claude panel (POST /v1/outputs, $0.50 USDC per verdict via x402
    — a live 402 was observed), and poll the verdict (GET /v1/verdicts/{verdict_id}) for ALLOW / HOLD / REJECT with confidence
    and findings. Published as OpenAPI 3.1.0 (v0.1.0) at https://verify.agenthealthmonitor.xyz/openapi.json with Swagger UI
    at /docs and a /health endpoint; separate from the AHS composite.'
  humanURL: https://agenthealthmonitor.xyz/verify
  image: https://agenthealthmonitor.xyz/static/ahm-logo.png
  baseURL: https://verify.agenthealthmonitor.xyz
  tags:
