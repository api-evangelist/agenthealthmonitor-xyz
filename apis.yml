apis:
- aid: agenthealthmonitor-xyz:agent-health-monitor-api
  name: Agent Health Monitor API
  description: REST API for agent-wallet trust and health on Base L2, published as OpenAPI 3.1.0 (v1.8.0) at https://agenthealthmonitor.xyz/openapi.json
    — 74 paths / 76 operations across Scoring & Risk (/risk, /risk/premium, /counterparties, /network-map), Health & Hygiene
    (/health, /wash, /ahs, /ahs/route, /ahs/route/policy, /ahs/batch, /report-card), Optimization (/optimize, /retry + free
    preview), Protection (/agent/protect + free preview), Alerts (subscribe / configure / status / unsubscribe with Slack,
    Discord or generic webhooks), plus discovery/info, partner coupon, Stripe billing and X-Internal-Key admin routes. Paid
    routes answer HTTP 402 with an x402 v2 PAYMENT-REQUIRED challenge (USDC on eip155:8453) unless an X-API-Key is sent. The
    spec declares no servers[] or securitySchemes; the base URL comes from the docs.
