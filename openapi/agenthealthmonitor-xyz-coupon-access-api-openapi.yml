openapi: 3.2.0
info:
  title: Agent Health Monitor Coupon Access API
  description: Wallet intelligence API for autonomous agents on Base L2.
  contact:
    name: AHM Support
    url: https://agenthealthmonitor.xyz/
  license:
    name: Proprietary
  version: 1.8.0
tags:
- name: Coupon Access
  description: Partner coupon routes — access any paid endpoint for free with a valid coupon code. Rate-limited to 5 requests per IP per minute.
paths:
  /coupon/validate/{code}:
    get:
      tags:
      - Coupon Access
      summary: Validate Coupon
      description: Check if a coupon code is valid. Rate-limited to 5 attempts per IP per minute.
      operationId: validate_coupon_coupon_validate__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /coupon/risk/{code}/{address}:
    get:
      tags:
      - Coupon Access
      summary: Coupon Risk
      description: Quick risk score via coupon — mirrors GET /risk/{address}.
      operationId: coupon_risk_coupon_risk__code___address__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: address
        in: path
        required: true
        schema:
          type: string
          description: Ethereum wallet address (0x-prefixed, 40 hex chars)
          examples:
          - '0xde0b295669a9fd93d5f28d9ec85e40f4cb697bae'
          title: Address
        description: Ethereum wallet address (0x-prefixed, 40 hex chars)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
