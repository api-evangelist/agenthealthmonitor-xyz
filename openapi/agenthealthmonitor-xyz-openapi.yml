          type: number
          title: Optimized Monthly Gas Usd
        estimated_monthly_savings_usd:
          type: number
          title: Estimated Monthly Savings Usd
        total_wasted_gas_eth:
          type: number
          title: Total Wasted Gas Eth
        total_wasted_gas_usd:
          type: number
          title: Total Wasted Gas Usd
        tx_types:
          items:
            $ref: '#/components/schemas/TransactionTypeOptimization'
          type: array
          title: Tx Types
        recommendations:
          items:
            type: string
          type: array
          title: Recommendations
        eth_price_usd:
          type: number
          title: Eth Price Usd
        analyzed_at:
          type: string
          title: Analyzed At
      type: object
      required:
