    CounterpartyResponse:
      properties:
        status:
          type: string
          title: Status
        address:
          type: string
          title: Address
        counterparties:
          items:
            $ref: '#/components/schemas/Counterparty'
          type: array
          title: Counterparties
          default: []
        total_counterparties:
          type: integer
          title: Total Counterparties
          default: 0
        nansen_available:
          type: boolean
          title: Nansen Available
          default: false
      type: object
      required:
      - status
      - address
      title: CounterpartyResponse
    EcosystemComparison:
      properties:
        average_ahs:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Ahs
          description: Ecosystem-wide average AHS score
          examples:
          - 58.3
        percentile_rank:
          type: integer
          title: Percentile Rank
          description: This wallet's percentile rank in the ecosystem (0-100)
          examples:
          - 72
        grade_distribution:
          additionalProperties: true
          type: object
          title: Grade Distribution
          description: Grade distribution across all scored agents
          examples:
          - A: 8
            B: 22
