          description: Gas efficiency letter grade
          examples:
          - C
        wasted_gas_usd:
          type: number
          title: Wasted Gas Usd
          description: USD value of gas wasted on failed txs
          examples:
          - 8.2
        failed_tx_count_24hr:
          type: integer
          title: Failed Tx Count 24Hr
          description: Failed transactions in the last 24 hours
          examples:
          - 3
        failed_tx_patterns:
          items: {}
          type: array
          title: Failed Tx Patterns
          description: Detected failure pattern names
          examples:
          - - repeated_revert
        nonce_gaps:
          type: integer
          title: Nonce Gaps
          description: Number of nonce gaps detected
          examples:
          - 0
        issues:
          items:
            $ref: '#/components/schemas/WashIssue'
          type: array
          title: Issues
          description: Detailed list of hygiene issues found
        recommendations:
          items:
            type: string
          type: array
          title: Recommendations
          description: Prioritised cleanup recommendations
          examples:
          - - Revoke approvals for 5 spam tokens
            - Set tighter gas limits on swap calls
        scan_timestamp:
          type: string
          title: Scan Timestamp
          description: ISO 8601 timestamp of this scan
          examples:
          - '2025-04-06T10:00:00Z'
        next_wash_recommended:
          type: string
          title: Next Wash Recommended
          description: Recommended next scan date
          examples:
          - '2025-04-13T10:00:00Z'
      type: object
      required:
      - address
      - cleanliness_score
      - cleanliness_grade
      - total_issues
      - issues_by_severity
      - dust_tokens
      - dust_total_usd
      - spam_tokens
      - spam_token_list
      - gas_efficiency_pct
      - gas_efficiency_grade
      - wasted_gas_usd
      - failed_tx_count_24hr
      - failed_tx_patterns
      - nonce_gaps
      - issues
      - recommendations
      - scan_timestamp
      - next_wash_recommended
      title: WashReport
    WashResponse:
      properties:
        status:
          type: string
          title: Status
          description: Response status
          examples:
          - ok
        report:
          $ref: '#/components/schemas/WashReport'
          description: Full hygiene scan report
      type: object
      required:
      - status
      - report
      title: WashResponse
tags:
- name: Scoring & Risk
  description: Risk scoring, counterparty analysis, and wallet network mapping. Fast pre-flight checks from $0.001 to deep
    Nansen-enriched analysis at $0.10.
- name: Health & Hygiene
  description: Wallet health diagnosis, hygiene scans, composite Agent Health Score (AHS), and visual report cards. Core analysis
    endpoints from $0.50 to $2.00.
- name: Optimization
  description: Gas optimization reports and failed-transaction retry bot. Returns per-transaction-type savings and ready-to-sign
    EIP-1559 retry payloads.
- name: Protection
  description: Autonomous protection agent that triages risk and runs the appropriate combination of health, optimization,
    and retry services automatically.
- name: Alerts
  description: Subscribe wallets to automated health monitoring with webhook alerts. Health checks run every 6 hours; alerts
    fire when configurable thresholds are breached.
- name: Coupon Access
  description: Partner coupon routes — access any paid endpoint for free with a valid coupon code. Rate-limited to 5 requests
    per IP per minute.
- name: Discovery & Info
  description: Service discovery, pricing info, ecosystem statistics, and x402/ERC-8004 well-known documents for automated
    agent registration.
- name: Billing
  description: Stripe checkout webhooks and API key management for fiat-paid access.
- name: Admin
  description: Internal admin endpoints protected by X-Internal-Key header. Security activity logs, trust registry, and registry
    scan triggers.
- name: Utility
  description: Health checks and AI chat assistant.
