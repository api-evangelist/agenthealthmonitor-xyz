components:
  schemas:
    AHSBatchRequest:
      properties:
        addresses:
          items:
            type: string
          type: array
          title: Addresses
        page:
          type: integer
          title: Page
          default: 1
        page_size:
          type: integer
          title: Page Size
          default: 10
      type: object
      required:
      - addresses
      title: AHSBatchRequest
    AHSBatchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/AHSBatchResultItem'
          type: array
          title: Results
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total_addresses:
          type: integer
          title: Total Addresses
        total_scored:
          type: integer
          title: Total Scored
        credits_used:
          type: integer
          title: Credits Used
        credits_remaining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Credits Remaining
        errors:
          items:
            type: string
          type: array
          title: Errors
      type: object
      required:
      - results
      - page
      - page_size
      - total_addresses
      - total_scored
      - credits_used
      - errors
      title: AHSBatchResponse
    AHSBatchResultItem:
      properties:
        address:
          type: string
          title: Address
        ahs_score:
          type: integer
          title: Ahs Score
        grade:
          type: string
          title: Grade
        d1_score:
          type: integer
          title: D1 Score
        d2_score:
          type: integer
          title: D2 Score
        pattern:
          type: string
          title: Pattern
        verdict:
          type: string
          title: Verdict
        routing_recommendation:
          type: string
          title: Routing Recommendation
      type: object
      required:
      - address
      - ahs_score
      - grade
      - d1_score
      - d2_score
      - pattern
      - verdict
      - routing_recommendation
      title: AHSBatchResultItem
    AHSCrossDimensionalPattern:
      properties:
        name:
          type: string
          title: Name
          description: Pattern identifier
          examples:
          - Zombie Agent
        detected:
          type: boolean
          title: Detected
          description: Whether this pattern was detected
          examples:
          - true
        severity:
          type: string
          title: Severity
          description: 'Pattern severity: info, warning, or critical'
          examples:
          - warning
        description:
          type: string
          title: Description
          description: Human-readable explanation
          examples:
          - Wallet shows signs of abandoned automation
      type: object
      required:
      - name
      - detected
      - severity
      - description
      title: AHSCrossDimensionalPattern
    AHSDimensionScore:
      properties:
        dimension:
          type: string
          title: Dimension
        score:
          type: integer
          title: Score
        weight:
          type: number
          title: Weight
        contributing_factors:
          items: {}
          type: array
          title: Contributing Factors
      type: object
      required:
      - dimension
      - score
      - weight
      - contributing_factors
      title: AHSDimensionScore
    AHSReport:
      properties:
        address:
          type: string
          title: Address
          description: Wallet address scored
          examples:
          - '0xde0b295669a9fd93d5f28d9ec85e40f4cb697bae'
        agent_health_score:
          type: integer
          title: Agent Health Score
          description: Composite AHS score 0-100
          examples:
          - 67
        grade:
          type: string
          title: Grade
          description: Letter grade A-F
          examples:
          - C
        confidence:
          type: string
          title: Confidence
          description: 'Score confidence level: high, medium, or low'
          examples:
          - high
        mode:
          type: string
          title: Mode
          description: 'Scoring mode: 2D (wallet + behavioural) or 3D (+ infrastructure)'
          examples:
          - 2D
        dimensions:
          items:
            $ref: '#/components/schemas/AHSDimensionScore'
          type: array
          title: Dimensions
          description: Per-dimension score breakdown
        patterns_detected:
          items:
            $ref: '#/components/schemas/AHSCrossDimensionalPattern'
          type: array
          title: Patterns Detected
          description: Cross-dimensional anomaly patterns detected
        trend:
          anyOf:
          - type: string
          - type: 'null'
          title: Trend
          description: 'Score trend vs previous scan: improving, stable, or declining'
          examples:
          - stable
        recommendations:
          items:
            type: string
          type: array
          title: Recommendations
          description: Prioritised improvement recommendations
          examples:
          - - Reduce revert rate below 5% to improve D1 score
            - Investigate Zombie Agent pattern
        ahs_token:
          type: string
          title: Ahs Token
          description: JWT token for temporal trend tracking across scans
          examples:
          - eyJhbGciOiJIUzI1NiIs...
        model_version:
          type: string
          title: Model Version
          description: AHS scoring model version
          examples:
          - 2.1.0
        scan_timestamp:
          type: string
          title: Scan Timestamp
          description: ISO 8601 timestamp of this scan
          examples:
          - '2025-04-06T10:00:00Z'
        next_scan_recommended:
          type: string
          title: Next Scan Recommended
          description: Recommended next scan date
          examples:
          - '2025-04-13T10:00:00Z'
        shadow_signals:
          anyOf:
          - $ref: '#/components/schemas/AHSShadowSignals'
          - type: 'null'
          description: Shadow signal analysis (session continuity, budget exhaustion)
        routing_recommendation:
          type: string
          title: Routing Recommendation
          description: 'Trust-based routing signal: instant_settle, escrow, or reject'
          examples:
          - escrow
      type: object
      required:
      - address
      - agent_health_score
      - grade
      - confidence
      - mode
      - dimensions
      - patterns_detected
      - recommendations
      - ahs_token
      - model_version
      - scan_timestamp
      - next_scan_recommended
      - routing_recommendation
      title: AHSReport
    AHSResponse:
      properties:
        status:
          type: string
          title: Status
          description: Response status
          examples:
          - ok
        report:
          $ref: '#/components/schemas/AHSReport'
          description: Full Agent Health Score report
      type: object
      required:
      - status
      - report
      title: AHSResponse
    AHSShadowSignals:
      properties:
        session_continuity_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Session Continuity Score
        abrupt_sessions:
          type: integer
          title: Abrupt Sessions
          default: 0
        budget_exhaustion_count:
          type: integer
          title: Budget Exhaustion Count
          default: 0
        total_sessions:
          type: integer
          title: Total Sessions
          default: 0
        avg_session_length:
          type: number
          title: Avg Session Length
          default: 0.0
        shadow_patterns:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Shadow Patterns
          default: []
      type: object
      title: AHSShadowSignals
    AgentPublicProfile:
      properties:
        address:
          type: string
          title: Address
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        registries:
          anyOf:
          - type: string
          - type: 'null'
          title: Registries
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        latest_ahs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Ahs
        latest_grade:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Grade
        rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rank
        percentile_rank:
          anyOf:
          - type: number
          - type: 'null'
          title: Percentile Rank
        first_seen_at:
          anyOf:
          - type: string
          - type: 'null'
          title: First Seen At
        last_scanned_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Scanned At
        scan_count:
          type: integer
          title: Scan Count
          default: 0
        gap_to_next_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Gap To Next Rank
        gap_to_next_tier:
          anyOf:
          - type: integer
          - type: 'null'
          title: Gap To Next Tier
      type: object
      required:
      - address
      title: AgentPublicProfile
      description: 'Free-safe agent profile for the public profile page.


        This model is the security gate: only explicitly listed fields can be

        serialised.  Dimensional scores (d1, d2, …) are structurally excluded.'
    AlertThresholds:
      properties:
        health_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Health Score
        failure_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Failure Rate
        waste_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Waste Usd
      type: object
      title: AlertThresholds
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
      type: object
      required:
      - message
      title: ChatRequest
    ConfigureRequest:
      properties:
        address:
          type: string
          title: Address
        webhook_url:
          type: string
          title: Webhook Url
        webhook_type:
          type: string
          title: Webhook Type
          default: generic
        thresholds:
          anyOf:
          - $ref: '#/components/schemas/AlertThresholds'
          - type: 'null'
      type: object
      required:
      - address
      - webhook_url
      title: ConfigureRequest
    Counterparty:
      properties:
        address:
          type: string
          title: Address
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        interaction_count:
          type: integer
          title: Interaction Count
          default: 0
        volume_usd:
          type: number
          title: Volume Usd
          default: 0.0
        last_interaction:
          anyOf:
          - type: string
