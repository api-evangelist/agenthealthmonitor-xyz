  evidence: The x402 "exact" scheme on an EVM network settles with an EIP-3009 authorization on the named asset (USDC 0x8335…2913,
    extra {name "USD Coin", version "2"} = the EIP-712 domain). Inferred from the scheme, not separately tested.
