summary: 'Agent Health Monitor''s conformance profile is the agent-economy / on-chain stack rather than the enterprise one:
  x402 v2 pay-per-call is VERIFIED live (HTTP 402 + PAYMENT-REQUIRED header on every paid route, plus a /.well-known/x402
  discovery document), an ERC-8004 registration-v1 file is served at /.well-known/agent-registration.json, network identifiers
  use CAIP-2 (eip155:8453) and the contracts are OpenAPI 3.1.0. The A2A card exists but grades flavored and its endpoint is
  not deployed. ERC-8183 and ERC-8210 involvement is documented prose (an evaluator worker on Arc testnet; "aligned with"
  ERC-8210) and is recorded as claimed, not verified. Nothing enterprise-grade is published: no SOC 2 / ISO 27001 / GDPR statement,
  no trust center, no terms of service or privacy policy page, no RFC 9116 security.txt, no OAuth/OIDC, and errors use the
  FastAPI {"detail"} envelope rather than RFC 9457. No Compliance pointer is emitted.'
standards:
- id: x402
  name: x402 payment protocol
  version: 2 (x402Version 2)
  conforms: true
  verification: probed
  evidence: GET https://agenthealthmonitor.xyz/risk/0x…0001 without payment -> HTTP 402, body {}, PAYMENT-REQUIRED header
    decoding to {x402Version 2, resource{url,description,mimeType}, accepts[{scheme exact, network eip155:8453, asset 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913,
    amount 1000, payTo 0xaD64EFCe9CfeE4d1D1701d9a0009CCa72B9ff000, maxTimeoutSeconds 300}], extensions.bazaar}. Same shape
    on PUT /ahs/route/policy and on POST https://verify.agenthealthmonitor.xyz/v1/outputs (amount 500000). Discovery document
    at /.well-known/x402 lists 15 resources with facilitator https://facilitator.payai.network. The docs page says "x402-native.
    All 14 endpoints support x402 micropayments (USDC on Base)".
  domain_standard_signature: true
- id: x402-bazaar-discovery
  name: x402 Bazaar discovery extension
  conforms: true
  verification: probed
  evidence: Every 402 challenge and every /.well-known/x402 endpoint entry carries extensions.bazaar.info {input{type http,
    method, discoverable true, queryParams}, output{type json, example, schema}}.
- id: erc-8004
  name: ERC-8004 Trustless Agents — registration file
  conforms: true
  verification: probed
  evidence: '/.well-known/agent-registration.json (200) with type https://eips.ethereum.org/EIPS/eip-8004#registration-v1,
    name, description, image and services[] {web, x402}. Docs and README name the on-chain identity as ERC-8004 #32328 (https://8004scan.io).
    The OpenAPI declares the route (agent_registration__well_known_agent_registration_json_get). On-chain registration itself
    was not verified by this pipeline.'
  domain_standard_signature: true
- id: caip-2
  name: CAIP-2 chain identifiers
  conforms: true
  verification: probed
  evidence: x402 accepts[].network and /.well-known/x402 payment[].network are "eip155:8453" (Base mainnet); the README documents
    NETWORK as a CAIP-2 id.
