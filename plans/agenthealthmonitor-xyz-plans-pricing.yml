summary: 'Agent Health Monitor publishes every price. Humans buy X-API-Key credit packs via Stripe payment links — Starter
  $9 one-time for 100 calls, Pro $39 one-time for 500 calls, Unlimited $99/month — all tiers cover all 14 endpoints (1 credit
  per call; /ahs/batch 1 credit per wallet). Agents pay per call in USDC on Base over x402 with no account: 15 payable resources
  from $0.001 (/risk) to $25.00 (/agent/protect), published both in prose and machine-readably at /api/info and /.well-known/x402.
  AHM Shield (the Python SDK / white-label layer) advertises Free $0 (100 route checks/month, 1 agent), Starter $29/month
  (10K checks, 5 agents), Pro $99/month (100K checks, 50 agents) and Enterprise $299/month (unlimited, "SLA + dedicated support",
  contact us). AHM Verify is $0.50 per verdict (standard); the /verify page also lists a $1.50 "deep" mode and free spec registration,
  but the Verify OpenAPI says only standard is implemented. A design-partner programme offers three months of free enterprise
  access. No free tier exists on the main API beyond the two preview endpoints and the info routes.'
