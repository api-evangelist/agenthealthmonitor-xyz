schemes:
- name: ApiKeyAuth
  type: apiKey
  in: header
  parameter: X-API-Key
  sources:
  - https://docs.agenthealthmonitor.xyz/#gs-api
  - README
  applies_to: every paid operation as an alternative to x402 (the source lists the X-API-Key bypass paths); required on api_key_status_api_key_status_get
    and partner_usage_partners__partner_id__usage_get
  header: 'X-API-Key: ahm_live_<secret>'
  key_format: ahm_live_ prefix (README, SDK examples, source); the docs quick-start shows ahm_sk_… — treat ahm_live_ as authoritative.
    Keys are credit-metered (Starter 100 / Pro 500 calls) or unlimited on the $99/month subscription; stored server-side and
    validated per request.
  issuance: Stripe payment links on https://agenthealthmonitor.xyz/pay-by-card; after checkout the key is retrieved once at
    GET /stripe/key/{session_id} (retrieve_key_stripe_key__session_id__get). Also via the design-partner programme.
  rotation: Not documented. No revoke/rotate operation in the API.
  errors:
    '401': '{"detail":"X-API-Key header required"} / {"detail":"Invalid or expired API key"}'
    '429': '{"detail":"API key calls exhausted"}'
  observed: GET https://agenthealthmonitor.xyz/api/key/status -> 401 {"detail":"X-API-Key header required"} (2026-09-19)
- name: X402Payment
  type: x402
  version: 2
  in: header
  parameter: X-PAYMENT (request) / PAYMENT-REQUIRED (402 challenge response)
  sources:
  - https://agenthealthmonitor.xyz/.well-known/x402
  - live 402 on GET /risk/{address}, GET /ahs/route/policy, POST verify /v1/outputs
  applies_to: the 15 payable resources in /.well-known/x402 (all 14 documented endpoints plus PUT /ahs/route/policy) and AHM
    Verify POST /v1/outputs
  network: eip155:8453 (Base mainnet)
  asset: USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 (EIP-712 domain name "USD Coin" version "2")
  scheme: exact
  pay_to:
    main_api: '0xaD64EFCe9CfeE4d1D1701d9a0009CCa72B9ff000'
    ahm_verify: '0x23A2e9Cd7F0a602A3FcFFaf8074113A9205726E5'
  facilitator: https://facilitator.payai.network
  max_timeout_seconds: 300
  flow: 1) call the endpoint; 2) receive 402 with body {} and PAYMENT-REQUIRED = base64 JSON {x402Version 2, error "Payment
    required", resource{url, description, mimeType}, accepts[{scheme, network, asset, amount, payTo, maxTimeoutSeconds, extra}],
    extensions.bazaar}; 3) sign an EIP-3009 transferWithAuthorization for accepts[0]; 4) resend with X-PAYMENT; the facilitator
    verifies and settles.
  identity: 'The payer wallet address becomes the caller identity for stateful routes (routing policy owner, batch limits)
    — "x402 callers: owner_id = lowercased payer wallet" in source.'
  observed: GET /risk/0x0000000000000000000000000000000000000001 -> 402, accepts[0].amount 1000 (= $0.001); GET /ahs/route/policy
    -> 402 amount 10000; POST https://verify.agenthealthmonitor.xyz/v1/outputs -> 402 amount 500000 (2026-09-19)
