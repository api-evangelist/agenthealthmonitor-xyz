input_conventions:
  address: Ethereum wallet address, 0x-prefixed, 40 hex chars (path parameter on every scoring route; examples in the spec
    use 0xde0b295669a9fd93d5f28d9ec85e40f4cb697bae)
  agent_url: Optional agent service URL (D3 overlay) — see docs "How the weights combine"
output_conventions:
  ahs: agent_health_score 0-100, grade A-F (A 90-100, B 75-89, C 60-74, D 40-59, E 20-39, F 0-19), confidence, dimensions[]
    {dimension, score, weight, contributing_factors}, patterns_detected[], recommendations[], model_version AHS-v1; INSUFFICIENT
    confidence instead of a low grade when history is thin
  routing: instant_settle (A/B) | escrow (C) | reject (D/E/F) under the default policy
  report_card: 1200x675 PNG plus a share URL
