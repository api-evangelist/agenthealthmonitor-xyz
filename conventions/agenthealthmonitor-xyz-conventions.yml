source: https://docs.agenthealthmonitor.xyz/ (Integration, API Quick Start, Endpoints), the OpenAPI at openapi/agenthealthmonitor-xyz-openapi.yml
  (info.description payment/coupon text, operation descriptions), the README of github.com/moonshot-cyber/agent-health-monitor,
