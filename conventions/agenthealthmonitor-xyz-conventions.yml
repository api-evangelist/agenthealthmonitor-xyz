description: 'How the Agent Health Monitor REST API behaves across every operation: pay-per-call x402 (HTTP 402 + PAYMENT-REQUIRED)
  or a fiat X-API-Key, no idempotency mechanism, no pagination, a FastAPI {"detail"} error envelope, per-IP rate limits with
  no headers, unversioned paths, and one reversible surface (alert subscriptions).'
base_url: https://agenthealthmonitor.xyz
api_style: REST over HTTPS, JSON responses; mostly GET with the wallet address in the path; FastAPI/Pydantic
authentication:
  scheme: x402 v2 payment (X-PAYMENT request header after a 402 challenge) OR X-API-Key header (fiat key bought via Stripe);
    X-Internal-Key on operator routes; partner coupon codes in the path (/coupon/{action}/{code}/{address})
  key_types:
  - ahm_live_ (README and SDK examples) — the docs quick-start shows ahm_sk_; only ahm_live_ appears in the source
  public_operations:
  - root__get and the HTML pages
  - api_info_api_info_get
  - ecosystem_stats_api_ecosystem_stats_get
  - leaderboard_api_leaderboard_get
