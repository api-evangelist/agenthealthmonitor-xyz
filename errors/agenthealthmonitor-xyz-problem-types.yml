  rate_limit_shape: '{ "error": "Rate limit exceeded", "detail": "<limit string, e.g. 60 per 1 minute>" }'
  payment_shape: HTTP 402 with an EMPTY JSON body ({}) — the x402 v2 challenge is carried in the PAYMENT-REQUIRED response
    header as base64 JSON {x402Version, error, resource, accepts[], extensions}
  request_id: No X-Request-Id was observed on any response (the source declares it in CORS expose_headers but no middleware
    sets it); Railway adds x-railway-request-id and Cloudflare adds cf-ray, which are the only correlation ids available.
  note: 'Not RFC 9457: no type URI, title or instance and no application/problem+json. The agent-recoverable part of the contract
    is the 402 PAYMENT-REQUIRED header — everything an x402 client needs to pay and retry is in it.'
problems:
- status: 402
  title: Payment Required (x402)
  operations:
  - 'every paid operation: get_risk_score_risk__address__get, get_premium_risk_score_risk_premium__address__get, get_counterparties_counterparties__address__get,
    get_network_map_network_map__address__get, get_health_report_health__address__get, get_wash_report_wash__address__post,
    get_ahs_report_ahs__address__get, get_trust_route_ahs_route__address__get, get_routing_policy_ahs_route_policy_get, put_routing_policy_ahs_route_policy_put,
    get_ahs_batch_ahs_batch_post, get_report_card_report_card__address__get, subscribe_alerts_alerts_subscribe__address__get,
    get_optimization_report_optimize__address__get, get_retry_transactions_retry__address__get, get_protection_report_agent_protect__address__get;
    AHM Verify submit_output_v1_outputs_post'
  meaning: 'No X-PAYMENT header and no valid X-API-Key. The PAYMENT-REQUIRED header names the price (accepts[].amount in USDC
    base units: 1000 = $0.001, 1000000 = $1.00, 500000 = $0.50), payTo, network eip155:8453 and maxTimeoutSeconds 300.'
  observed: GET /risk/0x0000000000000000000000000000000000000001 -> 402; GET /ahs/route/policy -> 402; GET /health (no address)
    -> 402; POST verify /v1/outputs -> 402
  remediation: Sign the EIP-3009 authorization for one accepts[] entry and resend with X-PAYMENT (an x402 client library does
    this automatically), or send X-API-Key with a purchased key.
  retryable: true
- status: 401
  title: Unauthorized — API key
  operations:
