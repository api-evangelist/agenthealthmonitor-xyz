- status: 422
  title: Validation Error
  operations:
  - every operation with a path/body parameter (declared in both specs)
  meaning: 'Pydantic validation failure: malformed wallet address (must be 0x-prefixed, 40 hex chars), missing required body
    fields, or a routing policy that fails its invariants (all six grades A–F assigned exactly once; escrow_disabled consistency;
    allowlist max 1000 valid addresses, no self-allowlisting, allowlisted addresses must be Grade C or above — put_routing_policy_ahs_route_policy_put).'
  schema: HTTPValidationError
  retryable: false
- status: 429
  title: Too Many Requests — per-IP rate limit
  operations:
  - 'every rate-limited route (slowapi): 60/minute on most, 20/minute on get_trust_route_ahs_route__address__get and get_report_card_report_card__address__get,
    10/minute on get_optimization_report_optimize__address__get and retry_preview_retry_preview__address__get; 5 per window
    on coupon validation/access; 10 per window on chat_chat_post'
  meaning: '{"error":"Rate limit exceeded","detail":"60 per 1 minute"}. No Retry-After or RateLimit headers are emitted.'
  source: api.py rate_limit_exceeded_handler (public source); limits are not documented on the docs site
  remediation: Back off for the remainder of the minute; the numbers are per client IP.
  retryable: true
- status: 429
  title: Too Many Requests — API key credits exhausted
  operations:
