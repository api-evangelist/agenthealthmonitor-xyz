  observed: GET /api/key/status -> 401 {"detail":"X-API-Key header required"}
  remediation: Buy a key at https://agenthealthmonitor.xyz/pay-by-card (Stripe) and send it as X-API-Key; keys are shown once
    at /stripe/key/{session_id} after checkout.
  retryable: false
